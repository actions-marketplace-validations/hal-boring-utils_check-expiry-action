name: Check certificate and domain expiry
description: Fail a scheduled workflow when a TLS certificate or domain registration is close to expiring. Made by Boring Utils.
author: Boring Utils
branding:
  icon: clock
  color: blue

inputs:
  domains:
    # Quoted: unquoted, YAML would read everything from " #" on as a comment.
    description: "Domains or IP addresses to check, separated by newlines, commas or spaces. URLs work too; only the host name is used. Text after # is ignored. A registration is looked up under exactly the name listed, so list a subdomain's registered domain too to check that registration. An entry that is not a domain name or IP address fails the step before anything is checked. Every name listed also gets the TLS certificate check on port 443."
    required: true
  cert-days:
    description: "When a certificate warns: 'auto', or a whole number of days, 0 or more. 'auto' warns certificates of 100 days or less when under an eighth of their lifetime is left, and longer ones under 30 days. A number warns under that many days left; 0 never warns, and an expired certificate still fails."
    required: false
    default: auto
  domain-days:
    description: Warn when a domain registration expires in fewer than this many days. A whole number, 0 or more; 0 never warns, and an expired registration still fails.
    required: false
    default: '30'
  fail-on-warning:
    description: "'true' or 'false'. With 'true', warnings fail the step too. Failures (an expired, untrusted or unreachable certificate, or an expired registration) always fail it."
    required: false
    default: 'true'

outputs:
  warnings:
    description: Number of warnings. Each host's certificate and registration count once.
    value: ${{ steps.check.outputs.warnings }}
  failures:
    description: Number of failures. Each host's certificate and registration count once.
    value: ${{ steps.check.outputs.failures }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        INPUT_DOMAINS: ${{ inputs.domains }}
        INPUT_CERT_DAYS: ${{ inputs.cert-days }}
        INPUT_DOMAIN_DAYS: ${{ inputs.domain-days }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
      # -I: isolated mode, so nothing in the caller's working directory is imported.
      run: python3 -I "$GITHUB_ACTION_PATH/check_expiry.py"
